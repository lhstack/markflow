# MarkFlow backend config
# Place this file next to markflow.exe
# Environment variables override file values

# Application
port = "3000"
database_url = "sqlite:markflow.db"
jwt_secret = "change_me_to_a_long_random_string_in_production"
share_password_secret = "change_me_to_a_long_random_string_for_share_password_encryption"
rust_log = "markflow=info,tower_http=warn"

# Upload root directory (relative to working dir or absolute path)
upload_dir = "uploads"

# Whether new user registration is enabled
registration_enabled = true

# Maximum upload size per file (MB)
upload_max_mb = 20

# Logging file output
# Enable file logging: true/false
log_to_file = true

# Log file directory (relative to working dir or absolute path)
log_dir = "logs"

# Active log file name
log_file_name = "markflow.log"

# Rotate when file size exceeds this value (MB)
log_rotate_size_mb = 50

# Rotate when file age reaches this many days
log_rotate_days = 1

# Keep rotated logs for this many days (<=0 means keep forever)
log_keep_days = 14

# MCP stdio support
# Default is disabled. When disabled, the frontend will not show the stdio transport option.
# You can enable it here or by environment variable `MCP_STDIO_ENABLED=true`.
mcp_stdio_enabled = false

# Allowed stdio command whitelist.
# Only commands listed here can be launched by MCP stdio.
# You can also override it by environment variable:
# MCP_STDIO_ALLOWED_COMMANDS=npx,node,uvx
mcp_stdio_allowed_commands = ["npx", "node", "uvx"]

# Skills manual directory (relative to working dir or absolute path)
# The agent loads operation manuals from here via skills_list / skills_view.
# Leave empty or remove to disable skills tools.
# Override by environment variable SKILLS_ROOT_DIR.
skills_root_dir = "./skills"

# Web Fetch tool configuration
# Enable default proxy for the web_fetch tool. This proxy only affects web_fetch, not model API requests.
# Override by environment variable WEB_FETCH_PROXY_ENABLED=true/false.
web_fetch_proxy_enabled = false

# Default proxy address used by web_fetch when proxy is enabled.
# Examples: http://127.0.0.1:7890, http://127.0.0.1:10809, socks5://127.0.0.1:1080
# Override by environment variable WEB_FETCH_PROXY.
web_fetch_proxy = ""

# Default request timeout for web_fetch, in seconds. Runtime clamp: 1..300.
# Override by environment variable WEB_FETCH_TIMEOUT_SECS.
web_fetch_timeout_secs = 30

# Default maximum response body bytes read by web_fetch. Runtime clamp: 1..5000000.
# Override by environment variable WEB_FETCH_MAX_RESPONSE_BYTES.
web_fetch_max_response_bytes = 1000000
